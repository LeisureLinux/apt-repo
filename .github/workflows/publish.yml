name: Publish APT Repo
on:
  workflow_dispatch:                 # 手动触发
  push:
    tags: ['v*']                     # 打 tag 自动触发
  repository_dispatch:               # 由 ghdeb / unbound-dashboard 等项目的 release 联动触发
    types: [publish]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install aptly
        run: |
          curl -fsSL -o /tmp/aptly.tgz \
            https://github.com/aptly-dev/aptly/releases/download/v1.5.0/aptly_1.5.0_linux_amd64.tar.gz
          tar -xzf /tmp/aptly.tgz -C /tmp
          sudo mv /tmp/aptly_1.5.0_linux_amd64/aptly /usr/local/bin/
          aptly version

      - name: Import GPG signing key
        env:
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          # 私钥来自本地: gpg --armor --export-secret-keys <KEYID> | gh secret set APT_GPG_PRIVATE_KEY

      # 方式 A：其他项目 release 后通过 repository_dispatch 通知，自动拉取该 release 的全部 .deb
      - name: Fetch debs from dispatched release
        if: github.event_name == 'repository_dispatch'
        env:
          SRC_OWNER: ${{ github.event.client_payload.owner }}
          SRC_REPO: ${{ github.event.client_payload.repo }}
          SRC_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          echo "📥 同步 ${SRC_OWNER}/${SRC_REPO} @ ${SRC_TAG}"
          curl -fsSL "https://api.github.com/repos/${SRC_OWNER}/${SRC_REPO}/releases/tags/${SRC_TAG}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            | jq -r '.assets[] | select(.name | endswith(".deb")) | .browser_download_url' > /tmp/deb-urls.txt
          cat /tmp/deb-urls.txt
          if [[ ! -s /tmp/deb-urls.txt ]]; then
            echo "❌ 该 release 没有 .deb 资产"; exit 1
          fi
          while IFS= read -r url; do
            curl -fsSL -o "incoming/$(basename "$url")" "$url"
          done < /tmp/deb-urls.txt
          ls -lh incoming/

      # 方式 B：按 debs.list 逐行拉取（适合第三方重打包包）
      - name: Fetch debs from debs.list
        if: github.event_name != 'repository_dispatch'
        run: |
          mkdir -p incoming
          if [[ -f debs.list ]]; then
            while IFS= read -r url; do
              [[ -z "$url" || "$url" == \#* ]] && continue
              echo "⬇️  $url"
              curl -fsSL -o "incoming/$(basename "$url")" "$url"
            done < debs.list
          fi
          ls -lh incoming/

      - name: Publish with aptly
        run: bash scripts/publish.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .aptly/public
          force_orphan: true
          cname: repo.freelamp.com
