name: Publish APT Repo
on:
  workflow_dispatch:          # 手动触发
  push:
    tags: ['v*']              # 打 tag 自动触发

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install aptly
        run: |
          curl -fsSL -o /tmp/aptly.tgz \
            https://github.com/aptly-dev/aptly/releases/download/v1.5.0/aptly_1.5.0_linux_amd64.tar.gz
          tar -xzf /tmp/aptly.tgz -C /tmp
          sudo mv /tmp/aptly_1.5.0_linux_amd64/aptly /usr/local/bin/
          aptly version

      - name: Import GPG signing key
        env:
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          # 私钥来自本地: gpg --armor --export-secret-keys <KEYID> | gh secret set APT_GPG_PRIVATE_KEY

      # 可选：从 GitHub Releases 按 debs.list 拉取 .deb
      - name: Fetch debs
        run: |
          mkdir -p incoming
          if [[ -f debs.list ]]; then
            while IFS= read -r url; do
              [[ -z "$url" || "$url" == \#* ]] && continue
              echo "⬇️  $url"
              curl -fsSL -o "incoming/$(basename "$url")" "$url"
            done < debs.list
          fi
          ls -lh incoming/

      # 可选：如需在 CI 里构建自己的包（如 ghdeb），参考 ghdeb 仓库的
      # build-deb.sh / release.sh，把 dist/*.deb 拷到 incoming/ 即可。

      - name: Publish with aptly
        run: bash scripts/publish.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .aptly/public
          force_orphan: true
          cname: repo.freelamp.com
