name: Publish APT Repo
on:
  workflow_dispatch:                 # 手动触发
  schedule:                          # 每天 02:00 UTC 兜底（防漏发）
    - cron: '0 2 * * *'
  repository_dispatch:               # 各项目发版后即时触发
    types: [publish]

permissions:
  contents: write

# 并发控制：deb-builder 批量构建完成、或多个项目同时发版时，可能瞬间涌入
# 多个 publish 触发。若并行执行，会同时往 gh-pages 推送导致 'cannot lock ref'
# 冲突（2026-08-26 实测连续十几个失败）。
# 加并发组后：同一时间只有一个 publish 在跑，新触发排队；由于每次运行都会
# 处理整个 incoming/ 目录，被取消的中间触发不会丢包（最新一次兜底发布全部内容）。
concurrency:
  group: publish-apt-repo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install aptly
        run: |
          curl -fsSL -o /tmp/aptly.tgz \
            https://github.com/aptly-dev/aptly/releases/download/v1.5.0/aptly_1.5.0_linux_amd64.tar.gz
          tar -xzf /tmp/aptly.tgz -C /tmp
          sudo mv /tmp/aptly_1.5.0_linux_amd64/aptly /usr/local/bin/
          aptly version

      - name: Import GPG signing key
        env:
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          # 私钥来自本地: gpg --armor --export-secret-keys <KEYID> | gh secret set APT_GPG_PRIVATE_KEY

      # 方式 A：从 conf/sources.txt 同步各项目最新 release 的全部 .deb（ghdeb、unbound-dashboard…）
      - name: Fetch debs from sources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/fetch-sources.sh

      # 方式 B：按 debs.list 逐行拉取（适合第三方重打包包）
      - name: Fetch debs from debs.list
        run: |
          if [[ -f debs.list ]]; then
            while IFS= read -r url; do
              [[ -z "$url" || "$url" == \#* ]] && continue
              echo "⬇️  $url"
              curl -fsSL -o "incoming/$(basename "$url")" "$url"
            done < debs.list
          fi
          ls -lh incoming/

      - name: Publish with aptly
        run: bash scripts/publish.sh

      # 自动生成 index.html / dists/index.html / pool/index.html（含最新包列表），
      # 使 GitHub Pages 上 /dists/ 和 /pool/ 不 404、包列表自动更新。
      - name: Generate indexes (auto-update package list)
        run: bash scripts/generate-index.sh

      # 生成 extrepo 数据源（index.yaml + GPG 签名），用户可用 extrepo 管理本源。
      - name: Generate extrepo data (sign + deploy)
        run: bash scripts/generate-extrepo-data.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .aptly/public
          force_orphan: true
          cname: repo.freelamp.com
